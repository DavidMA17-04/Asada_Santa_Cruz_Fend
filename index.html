<!doctype html>
<html lang="es">
<head>
  <script>
    (function () {
      try {
        var guardado = localStorage.getItem('asada_tema');
        var prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var esOscuro = guardado ? guardado === 'oscuro' : prefiereOscuro;
        if (esOscuro) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.tema = 'oscuro';
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.tema = 'claro';
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASADA Santa Cruz · Sistema de Gestión</title>
  <link rel="icon" type="image/png" href="/logo-asada.png">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
